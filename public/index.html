<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Journal</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <h1 class="title">Daily Journal</h1>
  <div class="container"></div>
  <div class="input-container">
    <form id="recordForm" enctype="multipart/form-data">
      <input type="text" name="dataEntry" id="dataEntry" placeholder="Write something..." required>
      <label for="imageInput" class="file-label">Attach Image</label>
      <input type="file" name="image" id="imageInput" accept="image/*">
      <button type="submit" id="save">Save</button>
    </form>
  </div>
</body>
</html>
